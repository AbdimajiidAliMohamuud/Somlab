{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Sign In — Somlab Diagnostics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <main class="auth-section">
    <div class="auth-card">
      <img class="admin-login-logo" src="{% static 'img/somlab-logo.png' %}" alt="Somlab Diagnostics">
      <span class="eyebrow">Private administration</span>
      <h1>Admin sign in</h1>
      <p>Use an authorized Somlab administrator account to continue.</p>
      <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form %}
        <button class="btn btn-primary btn-block" type="submit">Sign in to dashboard</button>
      </form>
    </div>
  </main>
</body>
</html>
