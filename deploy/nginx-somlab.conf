upstream somlab_app {
    server unix:/run/somlab/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name somlab.so www.somlab.so;

    # Customer portfolio uploads may contain six large videos. Cloudflare's
    # own upload limit still applies while the DNS record is proxied.
    client_max_body_size 6G;
    client_body_timeout 7200s;

    location / {
        proxy_pass http://somlab_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # Block hidden files but leave ACME challenges available to Certbot.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
}
